<script>
(function () {
  const root = document.getElementById('carte-concept');
  const icon = function (name) { return '<i data-lucide="' + name + '" aria-hidden="true"></i>'; };
  const categories = {
    plates: {label:'Plates', icon:'utensils', axes:['Light','Rich','Bold','Delicate'], items:[
      {id:'crudo',name:'Sea bass crudo',short:'Crudo',icon:'fish',x:24,y:24,price:19,tags:'Zesty · cool · a little heat',desc:'A bright, light bite with a little chilli at the finish.',menu:'Sea bass, lime, green chilli, coriander.',why:'Lime and chilli suggest bold flavour; raw fish keeps the dish light.',pair:'albarino'},
      {id:'steak',name:'Steak frites',short:'Steak frites',icon:'beef',x:78,y:22,price:34,tags:'Savoury · buttery · satisfying',desc:'The hearty corner: a seared steak, crisp fries and pepper butter.',menu:'Bavette steak, frites, green peppercorn butter.',why:'Seared beef and peppercorns suggest bold flavour; butter and fries add richness.',pair:'syrah'},

    wine: {label:'Wine',icon:'wine',axes:['Light','Full-bodied','Crisp','Round'],items:[

    const stored = snapshot && snapshot.privateContent && snapshot.privateContent.carte;

      const value = stored[key];

      const allowed = categories[value.category].items.map(function (i) { return i.id; });

  function footer(s) { return '<footer class="ct-footer"><span class="ct-mono">A little guide to good taste</span><button data-action="tonight" class="cursor-interaction">' + icon('bookmark') + 'Tonight <span class="ct-count">' + s.saved.length + '</span></button></footer>'; }
  function actions(s,item) { return '<div class="ct-actions"><button class="ct-primary cursor-interaction" data-action="save" data-id="' + item.id + '">' + icon(s.saved.includes(item.id)?'check':'plus') + (s.saved.includes(item.id)?'Saved for tonight':'Save for tonight') + '</button>' + (item.pair ? '<button class="ct-secondary cursor-interaction" data-action="pair" data-id="' + item.id + '">' + icon('wine') + 'Pair it</button>' : '') + '</div>'; }
  function evidence(s,item) { return '<button class="ct-why cursor-interaction" data-action="why" aria-expanded="' + s.why + '">' + (s.why?'Hide tasting note':'Why here?') + '</button>' + (s.why?'<div class="ct-evidence"><p>On the menu: “' + item.menu + '”</p><p style="margin-top:6px">' + item.why + '</p></div>':''); }
  function map(s,c) {
    return '<div class="ct-map" role="group" aria-label="Taste map. Horizontal: ' + c.axes[0] + ' to ' + c.axes[1] + '. Vertical: ' + c.axes[3] + ' to ' + c.axes[2] + '. Select an item to explore."><div class="ct-cross ct-cross-v"></div><div class="ct-cross ct-cross-h"></div><div class="ct-center"></div><span class="ct-axis ct-axis-top">' + c.axes[2] + '</span><span class="ct-axis ct-axis-bottom">' + c.axes[3] + '</span><span class="ct-axis ct-axis-left">' + c.axes[0] + '</span><span class="ct-axis ct-axis-right">' + c.axes[1] + '</span>' + c.items.map(function (i) { return '<button class="ct-mark cursor-interaction ' + (i.uncertain?'ct-uncertain':'') + '" data-action="select" data-id="' + i.id + '" aria-pressed="' + (s.selected===i.id) + '" aria-label="' + i.name + ', ' + i.tags + (i.uncertain?', estimated placement':'') + '" style="left:' + i.x + '%;top:' + i.y + '%"><span class="ct-glyph">' + icon(i.icon) + '</span><span class="ct-mark-label">' + i.short + '</span></button>'; }).join('') + '</div><p class="ct-map-note">' + (s.category==='wine'?'Dashed ring = a less certain placement':'A relative taste map · estimated from the menu') + '</p>';
  }
  function detail(s,item) { return '<section class="ct-detail" aria-label="Selected item"><div class="ct-detail-top"><h2>' + item.name + '</h2><span class="ct-price">$' + item.price + '</span></div><p class="ct-taste">' + item.tags + '</p><p class="ct-explanation">' + item.desc + '</p>' + evidence(s,item) + actions(s,item) + '</section>'; }
  function list(s,c) {
    return '<div class="ct-list-axis">' + c.axes[0] + ' ↔ ' + c.axes[1] + ' &nbsp; · &nbsp; ' + c.axes[3] + ' ↔ ' + c.axes[2] + '</div><div class="ct-rows">' + c.items.map(function (i) { return '<section class="ct-row"><button class="ct-row-pick cursor-interaction" data-action="select" data-id="' + i.id + '" aria-expanded="' + (s.selected===i.id) + '"><span class="ct-row-icon">' + icon(i.icon) + '</span><span class="ct-row-text"><span class="ct-row-name">' + i.name + '</span><span class="ct-row-notes">' + i.tags + ' · $' + i.price + '</span></span><span class="ct-mini" aria-hidden="true"><span class="ct-mini-dot" style="left:' + i.x + '%;top:' + i.y + '%"></span></span></button>' + (s.selected===i.id?'<div class="ct-row-more"><p class="ct-explanation">' + i.desc + '</p>' + evidence(s,i) + actions(s,i) + '</div>':'') + '</section>'; }).join('') + '</div>';
  }
  function explorer(s) {
    const c = categories[s.category];
    const item = c.items.find(function (i) { return i.id===s.selected; }) || c.items[0];
    return top() + '<div class="ct-heading"><div class="ct-kicker ct-mono"><span>Your evening, mapped</span><span>Sample menu</span></div><h1>Le Petit Jardin</h1><p class="ct-subtitle">A neighbourhood bistro · 18 things to discover</p></div><div class="ct-categories" role="group" aria-label="Menu category">' + Object.keys(categories).map(function (key) { return '<button class="cursor-interaction" data-action="category" data-category="' + key + '" aria-pressed="' + (s.category===key) + '">' + icon(categories[key].icon) + categories[key].label + '</button>'; }).join('') + '</div>' + (s.pairFrom?'<div class="ct-notice">With ' + s.pairFrom + ': try ' + item.name + '.<br>The suggested contrast comes from the menu descriptions.</div>':'') + '<div class="ct-viewbar"><span class="ct-mono">' + (s.view==='map'?'Find your corner':'The menu, with a little context') + '</span><button class="cursor-interaction" data-action="view">' + icon(s.view==='map'?'list':'move') + (s.view==='map'?'Menu view':'Taste map') + '</button></div>' + (s.view==='map'?map(s,c)+detail(s,item):list(s,c)) + footer(s);
  }
  function scanner(s) {
    return top() + '<button class="ct-back cursor-interaction" data-action="back">' + icon('arrow-left') + 'Back to your menu</button><div class="ct-mono">01 / Photograph</div><h1 class="ct-flow-title">Good taste starts<br>with a menu.</h1><p class="ct-flow-sub">Fit the whole page inside the frame.<br>You can add more pages next.</p><div class="ct-camera"><span class="ct-crop a"></span><span class="ct-crop b"></span><span class="ct-crop c"></span><span class="ct-crop d"></span><div class="ct-receipt"><h3>Le Petit Jardin</h3><div class="ct-mono">À la carte</div>' + categories.plates.items.map(function (i) { return '<div class="ct-print-row"><span>' + i.name + '</span><span>' + i.price + '</span></div>'; }).join('') + '</div></div><p class="ct-flow-fine">Scan preview · using an illustrative menu</p><div class="ct-flow-actions"><button class="ct-primary cursor-interaction" data-action="read">' + icon('camera') + 'Read this menu</button></div><p class="ct-flow-fine">A quick review before we draw your map.</p>';
  }
  function review(s) {
    return top() + '<button class="ct-back cursor-interaction" data-action="scan">' + icon('arrow-left') + 'Back to photo</button><div class="ct-mono">02 / Review</div><h1 class="ct-flow-title">A menu full<br>of possibilities.</h1><p class="ct-flow-sub">Le Petit Jardin<br>18 items across three categories.</p><div class="ct-review">' + Object.values(categories).map(function (c) { return '<div class="ct-review-line"><span>' + icon(c.icon) + c.label + '</span><span>6 items ' + icon('check') + '</span></div>'; }).join('') + '</div><div class="ct-review-note">Taste is a useful estimate. Tap “Why here?” on any item to see the menu description behind its position.</div><div class="ct-flow-actions"><button class="ct-primary cursor-interaction" data-action="explore">Draw my taste map ' + icon('arrow-right') + '</button></div><p class="ct-flow-fine">Illustrative scan · no camera or upload used</p>';
  }
  function tonight(s) {
    const saved = s.saved.map(function (id) { return allItems.find(function (i) { return i.id===id; }); }).filter(Boolean);
    return top() + '<button class="ct-back cursor-interaction" data-action="back">' + icon('arrow-left') + 'Back to your menu</button><div class="ct-mono">Le Petit Jardin</div><h1 class="ct-flow-title">For tonight.</h1><p class="ct-flow-sub">A few things that caught your eye.</p>' + (saved.length?'<div class="ct-rows" style="margin-top:25px">' + saved.map(function (i) { return '<div class="ct-saved-row">' + icon(i.icon) + '<div><span class="ct-row-name">' + i.name + '</span><span class="ct-row-notes">' + i.tags + ' · $' + i.price + '</span></div><button class="cursor-interaction" data-action="save" data-id="' + i.id + '" aria-label="Remove ' + i.name + ' from tonight">' + icon('x') + '</button></div>'; }).join('') + '</div><div class="ct-total"><span>Menu prices · one of each</span><span class="ct-price">$' + saved.reduce(function (a,i) { return a+i.price; },0) + '</span></div><p class="ct-flow-fine">Your shortlist · share your choices with your server</p>':'<div class="ct-empty">Your evening is<br>still unwritten.</div>') + '<div class="ct-flow-actions"><button class="ct-primary cursor-interaction" data-action="back">Keep exploring ' + icon('arrow-right') + '</button></div>';
  }
  function refreshIcons() { if (window.lucide) window.lucide.createIcons({attrs:{width:16,height:16}}); }
  function render(app) {
    const s = states[app.dataset.design];
    app.innerHTML = s.screen==='scan'?scanner(s):s.screen==='review'?review(s):s.screen==='tonight'?tonight(s):explorer(s);
    refreshIcons();
  }
  const apps = Array.from(root.querySelectorAll('.ct-app'));
  apps.forEach(function (app) {
    app.addEventListener('click',function (event) {
      const button = event.target.closest('button[data-action]');
      if (!button || !app.contains(button)) return;
      const s = states[app.dataset.design];
      const action = button.dataset.action;
      const focusAction = action;
      const focusId = button.dataset.id;
      const focusCategory = button.dataset.category;
      if (action==='category') { s.category=button.dataset.category; s.selected=categories[s.category].items[0].id; s.why=false; s.pairFrom=''; }
      if (action==='select') { s.selected=button.dataset.id; s.why=false; s.pairFrom=''; }
      if (action==='view') s.view=s.view==='map'?'list':'map';
      if (action==='why') s.why=!s.why;
      if (action==='save') { const id=button.dataset.id; s.saved=s.saved.includes(id)?s.saved.filter(function (v) { return v!==id; }):s.saved.concat(id); }
      if (action==='pair') { const dish=allItems.find(function (i) { return i.id===button.dataset.id; }); s.category='wine'; s.selected=dish.pair; s.pairFrom=dish.name; s.why=false; }
      if (action==='scan') s.screen='scan';
      if (action==='read') s.screen='review';
      if (action==='tonight') s.screen='tonight';
      if (action==='back' || action==='explore') s.screen='explore';
      render(app);
      const next = Array.from(app.querySelectorAll('button[data-action]')).find(function (b) { return b.dataset.action===focusAction && (!focusId || b.dataset.id===focusId) && (!focusCategory || b.dataset.category===focusCategory); });
      if (next) next.focus({preventScroll:true});
      const live = document.getElementById('carte-live-region');
      if (live) live.textContent = action==='category'?categories[s.category].label + ': axes now ' + categories[s.category].axes.join(', '):action==='save'?s.saved.length + ' items saved for tonight':action==='select'?'Selected ' + allItems.find(function (i) { return i.id===s.selected; }).name:action==='read'?'18 sample menu items ready to review':'';
      save();
    });
    render(app);
    if (globalThis.Tweak) {
      const style = {paper:'#f7f1e4',ink:'#203bb6',corners:19};
      const tweak = new Tweak({container:app,onChange:function () { app.style.setProperty('--ct-paper',style.paper);app.style.setProperty('--ct-ink',style.ink);app.style.borderRadius=style.corners+'px'; }});
      tweak.addColorPicker(style,'paper',{label:'Paper',reference:'--ct-paper'});
      tweak.addColorPicker(style,'ink',{label:'Ink',reference:'--ct-ink'});
      tweak.addSlider(style,'corners',{label:'Surface corners',min:0,max:28,unit:'px'});
    }
  });
  const live = document.createElement('div');
  live.id='carte-live-region';live.className='ct-live';live.setAttribute('aria-live','polite');live.setAttribute('aria-atomic','true');live.style.cssText='position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);';root.insertAdjacentElement('afterend',live);
  window.addEventListener('openai:set_globals',function (event) { const globals=event.detail && event.detail.globals; if (globals && globals.widgetState) { hydrate(globals.widgetState);apps.forEach(render); } });
})();
</script>
